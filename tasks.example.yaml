# Optional fault tolerance block.
# If omitted entirely, or if strategy is "NONE", the watcher is not started
# and run_task behaves exactly as before (Phase 2 behavior).
#
# Uncomment and set strategy to REPLACE_RESUME or DEGRADED_RESUME to enable the watcher.
#   "NONE"             — no watcher (explicit opt-out, same as omitting the block)
#   "REPLACE_RESUME"   — replace interrupted worker + restart from checkpoint
#   "DEGRADED_RESUME"  — resume with remaining workers (no replacement)
#
fault_tolerance:
  strategy: "NONE"                     # "NONE" | "REPLACE_RESUME" | "DEGRADED_RESUME"
  replacement_allocation_mode: "spot"  # only for REPLACE_RESUME: "spot" | "on-demand"
  process_count: 4                     # total MPI process count
  checkpoint_dir: "/shared/checkpoints"
  poll_interval_secs: 10               # how often to poll the AWS EC2 API

tasks:
  # Smoke test: verify all Slurm nodes are registered and IDLE
  - task_tag: "slurm_smoke_test"
    setup_commands:
      - sinfo -N
      - scontrol show nodes
    run_commands: []

  # NPB EP class A — embarrassingly parallel, good for baseline throughput
  - task_tag: "npb_ep_a"
    setup_commands: []
    run_commands:
      - srun -N2 -n4 /home/ec2-user/downloads/NPB3.4.4/NPB3.4-MPI/bin/ep.A.x

  # NPB CG class A — conjugate gradient, communication-heavy
  - task_tag: "npb_cg_a"
    setup_commands: []
    run_commands:
      - srun -N2 -n4 /home/ec2-user/downloads/NPB3.4.4/NPB3.4-MPI/bin/cg.A.x

