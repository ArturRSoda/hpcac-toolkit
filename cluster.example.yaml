id: MyClusterId  # Optional, must be unique
display_name: MyHPCCluster  # Required, must be unique
public_ssh_key_path: ~/.ssh/id_ed25519.pub
private_ssh_key_path: ~/.ssh/id_ed25519
provider_id: aws
region: us-east-1
availability_zone: us-east-1a
use_node_affinity: false
use_elastic_fabric_adapters: false
use_elastic_file_system: true
on_instance_creation_failure: cancel # options: cancel, migrate or on-demand
nodes:
  # Head node: must be on-demand, exactly one per cluster
  - role: head
    instance_type: t3.medium
    allocation_mode: on-demand
    burstable_mode: Unlimited
    image_id: ami-06af33e2399c52709

  # Worker nodes: spot for cost efficiency
  - role: worker
    instance_type: m5.large
    allocation_mode: spot
    image_id: ami-06af33e2399c52709

  - role: worker
    instance_type: m5.large
    allocation_mode: spot
    image_id: ami-06af33e2399c52709

