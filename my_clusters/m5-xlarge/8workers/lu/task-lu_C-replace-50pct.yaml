fault_tolerance:
  strategy: "REPLACE_RESUME"
  replacement_allocation_mode: "on-demand"
  process_count: 16  # 8 workers × 2 Core/worker
  checkpoint_dir: "/shared/checkpoints"
  poll_interval_secs: 1
  terminate_cluster_on_zero_workers: false
  auto_test_failure:
    trigger_after_secs: 34        # fire 34s after run starts
    target_worker_index: 0        # 0 = first worker (ip-10-0-0-11)
    warning_time_secs: 120        # 2-min spot warning simulation

tasks:
  - task_tag: "lu-C_8w_m5xl_replace-50pct"
    setup_commands:
      - make -C ~/downloads/NPB3.4.4/NPB3.4-MPI lu CLASS=C | tee make.txt
      - sudo cp ~/downloads/NPB3.4.4/NPB3.4-MPI/bin/lu.C.x /shared/lu.C.x && sudo chmod 755 /shared/lu.C.x
      - sudo pkill -9 -f dmtcp_coordinator && sudo pkill -9 -f mana_coordinator || true
      - sudo chown ec2-user:ec2-user /shared/checkpoints && sudo chmod 775 /shared/checkpoints
      - rm -rf /shared/checkpoints/*
      - |
        cat > /tmp/hpcac_run.sh <<'INNER'
        #!/bin/bash
        WORKERS="ip-10-0-0-11,ip-10-0-0-12,ip-10-0-0-13,ip-10-0-0-14,ip-10-0-0-15,ip-10-0-0-16,ip-10-0-0-17,ip-10-0-0-18"
        export DMTCP_COORD_HOST=10.0.0.10
        export DMTCP_COORD_PORT=7779
        srun --overlap --immediate=5 --nodelist="$WORKERS" -N8 -n8 --label /bin/sh -c 'pkill -9 -f lower-half || true; pkill -9 -f mana_launch || true; pkill -9 -f dmtcp_launch || true; pkill -9 -f dmtcp_worker || true'
        rm -f "$HOME/.mana-slurm-$SLURM_JOB_ID.rc"
        echo $SLURM_JOB_ID > ~/.tmp_job_id
        /opt/mana/bin/mana_coordinator --port 7779 --ckptdir /shared/checkpoints --exit-on-last &
        DEST=".mana-slurm-${SLURM_JOB_ID}.rc"
        for i in $(seq 1 30); do
          [ -s "$HOME/$DEST" ] && break
          sleep 1
        done
        RC="/shared/slurm/.mana-slurm-${SLURM_JOB_ID}.rc"
        sudo cp -f "$HOME/$DEST" "$RC"
        sudo chmod 644 "$RC"
        srun --overlap --immediate=5 --nodelist="$WORKERS" -N8 -n8 --label env RC="$RC" DEST="$DEST" /bin/sh -c 'cp -f "$RC" "$HOME/$DEST"'
        srun --overlap --mpi=pmi2 --nodelist="$WORKERS" -N8 -n16 --ntasks-per-node=2 bash -c 'cd /shared/checkpoints && /opt/mana/bin/mana_launch --timing --verbose --ckptdir /shared/checkpoints /shared/lu.C.x'
        INNER
      - chmod +x /tmp/hpcac_run.sh
    run_commands:
      - salloc -w ip-10-0-0-11,ip-10-0-0-12,ip-10-0-0-13,ip-10-0-0-14,ip-10-0-0-15,ip-10-0-0-16,ip-10-0-0-17,ip-10-0-0-18 -N8 -n16 -t 00:30:00 bash /tmp/hpcac_run.sh 2>&1 | tee output.txt

# test-failure (LU.C quiescing ~10-15s on 16 procs; 120s warning is safe):
# cargo run cluster test-failure --cluster-id ClusterMANA_8Workers_m5-xlarge --node-private-ip 10.0.0.11 --warning-time 120 -y
