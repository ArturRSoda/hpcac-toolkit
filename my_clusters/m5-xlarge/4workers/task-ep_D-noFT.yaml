fault_tolerance:
  strategy: "NONE"
  process_count: 8  # 4 workers × 2 Core/worker
  checkpoint_dir: "/shared/checkpoints"
  poll_interval_secs: 10
  terminate_cluster_on_zero_workers: false

tasks:
  - task_tag: "ep-D_4w_m5xl_noFT"
    setup_commands:
      - make -C ~/downloads/NPB3.4.4/NPB3.4-MPI ep CLASS=D | tee make.txt
      - sudo cp ~/downloads/NPB3.4.4/NPB3.4-MPI/bin/ep.D.x /shared/ep.D.x && sudo chmod 755 /shared/ep.D.x
    run_commands:
      - srun --nodelist="ip-10-0-0-11,ip-10-0-0-12,ip-10-0-0-13,ip-10-0-0-14" -N4 -n8 --ntasks-per-node=2 /shared/ep.D.x 2>&1 | tee output.txt

