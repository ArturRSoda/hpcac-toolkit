fault_tolerance:
  strategy: "NONE"
  process_count: 4  # 2 workers x 2 cores/worker
  checkpoint_dir: "/shared/checkpoints"
  poll_interval_secs: 5
  terminate_cluster_on_zero_workers: false

tasks:
  - task_tag: "synth_p2p-l0_2w_m5xl_noFT"
    setup_commands:
      - |
        cat > /tmp/synth_p2p.c <<'CSRC'
        #include <mpi.h>
        #include <stdio.h>
        #include <stdlib.h>
        #define TOTAL_OUTER  51200L
        #define INNER_ITERS  281250L
        int main(int argc, char **argv) {
            MPI_Init(&argc, &argv);
            int rank, nprocs;
            MPI_Comm_rank(MPI_COMM_WORLD, &rank);
            MPI_Comm_size(MPI_COMM_WORLD, &nprocs);
            long call_period = CALL_PERIOD;
            int partner = (rank + nprocs / 2) % nprocs;
            volatile double x = (double)(rank + 1);
            double result = 0.0;
            long call_count = 0;
            MPI_Status status;
            double t_start = MPI_Wtime();
            for (long outer = 0; outer < TOTAL_OUTER; outer++) {
                for (long i = 0; i < INNER_ITERS; i++)
                    x = x * 1.0000001 + 1e-10;
                if (call_period > 0 && outer % call_period == 0) {
                    if (rank < nprocs / 2) {
                        MPI_Send(&x, 1, MPI_DOUBLE, partner, 0, MPI_COMM_WORLD);
                        MPI_Recv(&result, 1, MPI_DOUBLE, partner, 0, MPI_COMM_WORLD, &status);
                    } else {
                        MPI_Recv(&result, 1, MPI_DOUBLE, partner, 0, MPI_COMM_WORLD, &status);
                        MPI_Send(&x, 1, MPI_DOUBLE, partner, 0, MPI_COMM_WORLD);
                    }
                    x += result * 1e-20;
                    call_count++;
                }
            }
            double elapsed = MPI_Wtime() - t_start;
            double total = 0.0;
            MPI_Reduce(&x, &total, 1, MPI_DOUBLE, MPI_SUM, 0, MPI_COMM_WORLD);
            if (rank == 0)
                printf("synth_p2p: elapsed=%.2fs calls=%ld period=%d nprocs=%d result=%.6e\n",
                       elapsed, call_count, CALL_PERIOD, nprocs, total);
            MPI_Finalize();
            return 0;
        }
        CSRC
      - mpicc -O2 -DCALL_PERIOD=0 -o /shared/synth_p2p /tmp/synth_p2p.c && sudo chmod 755 /shared/synth_p2p
    run_commands:
      - srun --nodelist="ip-10-0-0-11,ip-10-0-0-12" -N2 -n4 --ntasks-per-node=2 /shared/synth_p2p 2>&1 | tee output.txt
