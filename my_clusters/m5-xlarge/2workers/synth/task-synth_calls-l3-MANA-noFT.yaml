fault_tolerance:
  strategy: "NONE"
  process_count: 4  # 2 workers x 2 cores/worker
  checkpoint_dir: "/shared/checkpoints"
  poll_interval_secs: 5
  terminate_cluster_on_zero_workers: false

tasks:
  - task_tag: "synth_calls-l3_2w_m5xl_MANA-noFT"
    setup_commands:
      - |
        cat > /tmp/synth_mpi_calls.c <<'CSRC'
        #include <mpi.h>
        #include <stdio.h>
        #include <stdlib.h>
        #define TOTAL_OUTER  51200L
        #define INNER_ITERS  281250L
        int main(int argc, char **argv) {
            MPI_Init(&argc, &argv);
            int rank, nprocs;
            MPI_Comm_rank(MPI_COMM_WORLD, &rank);
            MPI_Comm_size(MPI_COMM_WORLD, &nprocs);
            long call_period = CALL_PERIOD;
            volatile double x = (double)(rank + 1);
            double result = 0.0;
            long call_count = 0;
            double t_start = MPI_Wtime();
            for (long outer = 0; outer < TOTAL_OUTER; outer++) {
                for (long i = 0; i < INNER_ITERS; i++)
                    x = x * 1.0000001 + 1e-10;
                if (call_period > 0 && outer % call_period == 0) {
                    MPI_Allreduce(&x, &result, 1, MPI_DOUBLE, MPI_SUM, MPI_COMM_WORLD);
                    x += result * 1e-20;
                    call_count++;
                }
            }
            double elapsed = MPI_Wtime() - t_start;
            double total = 0.0;
            MPI_Reduce(&x, &total, 1, MPI_DOUBLE, MPI_SUM, 0, MPI_COMM_WORLD);
            if (rank == 0)
                printf("synth_mpi_calls: elapsed=%.2fs calls=%ld period=%d nprocs=%d result=%.6e\n",
                       elapsed, call_count, CALL_PERIOD, nprocs, total);
            MPI_Finalize();
            return 0;
        }
        CSRC
      - mpicc -O2 -DCALL_PERIOD=4 -o /shared/synth_mpi_calls /tmp/synth_mpi_calls.c && sudo chmod 755 /shared/synth_mpi_calls
      - sudo pkill -9 -f dmtcp_coordinator && sudo pkill -9 -f mana_coordinator || true
      - sudo chown ec2-user:ec2-user /shared/checkpoints && sudo chmod 775 /shared/checkpoints
      - rm -rf /shared/checkpoints/*
      - |
        cat > /tmp/hpcac_run.sh <<'INNER'
        #!/bin/bash
        WORKERS="ip-10-0-0-11,ip-10-0-0-12"
        export DMTCP_COORD_HOST=10.0.0.10
        export DMTCP_COORD_PORT=7779
        srun --overlap --immediate=5 --nodelist="$WORKERS" -N2 -n2 --label /bin/sh -c 'pkill -9 -f lower-half || true; pkill -9 -f mana_launch || true; pkill -9 -f dmtcp_launch || true; pkill -9 -f dmtcp_worker || true'
        rm -f "$HOME/.mana-slurm-$SLURM_JOB_ID.rc"
        echo $SLURM_JOB_ID > ~/.tmp_job_id
        /opt/mana/bin/mana_coordinator --port 7779 --ckptdir /shared/checkpoints --exit-on-last &
        DEST=".mana-slurm-${SLURM_JOB_ID}.rc"
        for i in $(seq 1 30); do
          [ -s "$HOME/$DEST" ] && break
          sleep 1
        done
        RC="/shared/slurm/.mana-slurm-${SLURM_JOB_ID}.rc"
        sudo cp -f "$HOME/$DEST" "$RC"
        sudo chmod 644 "$RC"
        srun --overlap --immediate=5 --nodelist="$WORKERS" -N2 -n2 --label env RC="$RC" DEST="$DEST" /bin/sh -c 'cp -f "$RC" "$HOME/$DEST"'
        srun --overlap --mpi=pmi2 --nodelist="$WORKERS" -N2 -n4 --ntasks-per-node=2 bash -c 'cd /shared/checkpoints && /opt/mana/bin/mana_launch --timing --verbose --ckptdir /shared/checkpoints /shared/synth_mpi_calls'
        INNER
      - chmod +x /tmp/hpcac_run.sh
    run_commands:
      - salloc -w ip-10-0-0-11,ip-10-0-0-12 -N2 -n4 -t 00:30:00 bash /tmp/hpcac_run.sh 2>&1 | tee output.txt
