fault_tolerance:
  strategy: "DEGRADED_RESUME"
  process_count: 4  # 2 workers x 2 cores/worker
  checkpoint_dir: "/shared/checkpoints"
  poll_interval_secs: 5
  terminate_cluster_on_zero_workers: false
  auto_test_failure:
    trigger_after_secs: 30
    target_worker_index: 0        # 0 = first worker (ip-10-0-0-11)
    warning_time_secs: 120        # 2-min spot warning simulation

tasks:
  - task_tag: "synth_ckpt-800mb_2w_m5xl_degraded"
    setup_commands:
      - |
        cat > /tmp/synth_ckpt_size.c <<'CSRC'
        #include <mpi.h>
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        #define TARGET_SECS 120.0
        int main(int argc, char **argv) {
            MPI_Init(&argc, &argv);
            int rank, nprocs;
            MPI_Comm_rank(MPI_COMM_WORLD, &rank);
            MPI_Comm_size(MPI_COMM_WORLD, &nprocs);
            long mem_mb = MEM_MB;
            long n = (mem_mb * 1024L * 1024L) / sizeof(double);
            double *buf = (double *)malloc(n * sizeof(double));
            if (!buf) { fprintf(stderr, "rank %d: malloc(%ld MB) failed\n", rank, mem_mb); MPI_Abort(MPI_COMM_WORLD, 1); }
            memset(buf, 0x42, n * sizeof(double));
            if (rank == 0) printf("synth_ckpt_size: %d MB/proc, %d procs, running %.0fs\n", MEM_MB, nprocs, TARGET_SECS);
            double t_start = MPI_Wtime();
            volatile long counter = 0;
            while (MPI_Wtime() - t_start < TARGET_SECS) {
                buf[counter % n] += 1.0;
                counter++;
                if (counter % 5000000L == 0) MPI_Barrier(MPI_COMM_WORLD);
            }
            if (rank == 0) printf("synth_ckpt_size: done counter=%ld\n", counter);
            free(buf);
            MPI_Finalize();
            return 0;
        }
        CSRC
      - mpicc -O2 -DMEM_MB=800 -o /shared/synth_ckpt_size /tmp/synth_ckpt_size.c && sudo chmod 755 /shared/synth_ckpt_size
      - sudo pkill -9 -f dmtcp_coordinator && sudo pkill -9 -f mana_coordinator || true
      - sudo chown ec2-user:ec2-user /shared/checkpoints && sudo chmod 775 /shared/checkpoints
      - rm -rf /shared/checkpoints/*
      - |
        cat > /tmp/hpcac_run.sh <<'INNER'
        #!/bin/bash
        WORKERS="ip-10-0-0-11,ip-10-0-0-12"
        export DMTCP_COORD_HOST=10.0.0.10
        export DMTCP_COORD_PORT=7779
        srun --overlap --immediate=5 --nodelist="$WORKERS" -N2 -n2 --label /bin/sh -c 'pkill -9 -f lower-half || true; pkill -9 -f mana_launch || true; pkill -9 -f dmtcp_launch || true; pkill -9 -f dmtcp_worker || true'
        rm -f "$HOME/.mana-slurm-$SLURM_JOB_ID.rc"
        echo $SLURM_JOB_ID > ~/.tmp_job_id
        /opt/mana/bin/mana_coordinator --port 7779 --ckptdir /shared/checkpoints --exit-on-last &
        DEST=".mana-slurm-${SLURM_JOB_ID}.rc"
        for i in $(seq 1 30); do
          [ -s "$HOME/$DEST" ] && break
          sleep 1
        done
        RC="/shared/slurm/.mana-slurm-${SLURM_JOB_ID}.rc"
        sudo cp -f "$HOME/$DEST" "$RC"
        sudo chmod 644 "$RC"
        srun --overlap --immediate=5 --nodelist="$WORKERS" -N2 -n2 --label env RC="$RC" DEST="$DEST" /bin/sh -c 'cp -f "$RC" "$HOME/$DEST"'
        srun --overlap --mpi=pmi2 --nodelist="$WORKERS" -N2 -n4 --ntasks-per-node=2 bash -c 'cd /shared/checkpoints && /opt/mana/bin/mana_launch --timing --verbose --ckptdir /shared/checkpoints /shared/synth_ckpt_size'
        INNER
      - chmod +x /tmp/hpcac_run.sh
    run_commands:
      - salloc -w ip-10-0-0-11,ip-10-0-0-12 -N2 -n4 -t 00:30:00 bash /tmp/hpcac_run.sh 2>&1 | tee output.txt
