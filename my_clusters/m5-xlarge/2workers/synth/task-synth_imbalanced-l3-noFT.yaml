fault_tolerance:
  strategy: "NONE"
  process_count: 4  # 2 workers x 2 cores/worker
  checkpoint_dir: "/shared/checkpoints"
  poll_interval_secs: 5
  terminate_cluster_on_zero_workers: false

tasks:
  - task_tag: "synth_imbalanced-l3_2w_m5xl_noFT"
    setup_commands:
      - |
        cat > /tmp/synth_imbalanced.c <<'CSRC'
        #include <mpi.h>
        #include <stdio.h>
        #include <stdlib.h>
        #include <unistd.h>
        #define TOTAL_OUTER  51200L
        #define INNER_ITERS  281250L
        #define CALL_PERIOD  64
        int main(int argc, char **argv) {
            MPI_Init(&argc, &argv);
            int rank, nprocs;
            MPI_Comm_rank(MPI_COMM_WORLD, &rank);
            MPI_Comm_size(MPI_COMM_WORLD, &nprocs);
            int partner = (rank + nprocs / 2) % nprocs;
            int is_sender = (rank < nprocs / 2);
            volatile double x = (double)(rank + 1);
            double recv_buf = 0.0;
            long call_count = 0;
            MPI_Request request;
            MPI_Status status;
            double t_start = MPI_Wtime();
            for (long outer = 0; outer < TOTAL_OUTER; outer++) {
                for (long i = 0; i < INNER_ITERS; i++)
                    x = x * 1.0000001 + 1e-10;
                if (outer % CALL_PERIOD == 0) {
                    if (is_sender) {
                        if (DELAY_US > 0) usleep(DELAY_US);
                        MPI_Send(&x, 1, MPI_DOUBLE, partner, 0, MPI_COMM_WORLD);
                        MPI_Irecv(&recv_buf, 1, MPI_DOUBLE, partner, 1, MPI_COMM_WORLD, &request);
                        MPI_Wait(&request, &status);
                    } else {
                        MPI_Irecv(&recv_buf, 1, MPI_DOUBLE, partner, 0, MPI_COMM_WORLD, &request);
                        MPI_Wait(&request, &status);
                        MPI_Send(&x, 1, MPI_DOUBLE, partner, 1, MPI_COMM_WORLD);
                    }
                    x += recv_buf * 1e-20;
                    call_count++;
                }
            }
            double elapsed = MPI_Wtime() - t_start;
            double total = 0.0;
            MPI_Reduce(&x, &total, 1, MPI_DOUBLE, MPI_SUM, 0, MPI_COMM_WORLD);
            if (rank == 0)
                printf("synth_imbalanced: elapsed=%.2fs calls=%ld delay_us=%d nprocs=%d result=%.6e\n",
                       elapsed, call_count, DELAY_US, nprocs, total);
            MPI_Finalize();
            return 0;
        }
        CSRC
      - mpicc -O2 -DDELAY_US=5000 -o /shared/synth_imbalanced /tmp/synth_imbalanced.c && sudo chmod 755 /shared/synth_imbalanced
    run_commands:
      - srun --nodelist="ip-10-0-0-11,ip-10-0-0-12" -N2 -n4 --ntasks-per-node=2 /shared/synth_imbalanced 2>&1 | tee output.txt
